// android/build.gradle
// Configuration Gradle pour supporter les deux architectures simultanément.
//
// Stratégie Android de rétrocompatibilité :
//   Avec newArchEnabled=true  → compile les sources dans src/newarch/
//   Sans newArchEnabled        → compile les sources dans src/oldarch/
//
// Cela évite d'utiliser des #ifdef (non disponibles en Java) et permet
// d'avoir deux implémentations propres de TextRecognitionPackage.

buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: 'com.android.library'

// ─── Détection de l'architecture active ──────────────────────────────────────
// newArchEnabled est positionné dans gradle.properties de l'app utilisatrice :
//   newArchEnabled=true   → New Architecture
//   (absent ou false)     → Ancienne architecture
def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

// Active le plugin React (Codegen) uniquement en New Architecture
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    compileSdkVersion safeExtGet('compileSdkVersion', 33)
    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 33)
    }

    sourceSets {
        main {
            // ─── Dual sourceset : le cœur de la stratégie ────────────────────
            // Java srcDirs change selon l'archi :
            //   newarch/ → TextRecognitionPackage extends TurboReactPackage
            //   oldarch/ → TextRecognitionPackage implements ReactPackage
            //
            // TextRecognitionModule.java reste dans src/main/ car identique
            // dans les deux cas (seule la classe parente change, gérée ici).
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
            }
        }
    }
}

// ─── Codegen (New Arch uniquement) ───────────────────────────────────────────
if (isNewArchitectureEnabled()) {
    react {
        jsRootDir = file("../src/")          // Où trouver NativeTextRecognition.ts
        libraryName = "TextRecognitionSpec"  // Nom du Spec (doit correspondre à codegenConfig.name)
        codegenJavaPackageName = "com.rnmlkit.textrecognition"
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-devanagari:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-japanese:16.0.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-korean:16.0.0'
}

// ─── Structure de fichiers attendue ──────────────────────────────────────────
//
// android/
// └── src/
//     ├── main/java/com/rnmlkit/textrecognition/
//     │   └── TextRecognitionModule.java      ← logique métier (commun aux deux archis)
//     │
//     ├── newarch/com/rnmlkit/textrecognition/
//     │   └── TextRecognitionPackage.java     ← extends TurboReactPackage
//     │
//     └── oldarch/com/rnmlkit/textrecognition/
//         └── TextRecognitionPackage.java     ← implements ReactPackage (original)
